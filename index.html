<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профсоюзные ресурсы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #009b35;
            font-size: 36px;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .resource-card {
            background: #ffffff;
            border: 2px solid #009b35;
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 155, 53, 0.1);
        }

        .resource-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 155, 53, 0.2);
            border-color: #ff7c2c;
        }

        .resource-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .emblem-placeholder {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #ff7c2c;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .emblem-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .resource-name {
            font-size: 18px;
            font-weight: 600;
            color: #009b35;
            line-height: 1.3;
        }

        .social-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .social-btn:hover {
            transform: scale(1.1);
        }

        .social-btn.vk {
            background: #009b35;
            border-color: #009b35;
        }

        .social-btn.vk:hover {
            background: rgba(0, 155, 53, 0.8);
        }

        .social-btn.max {
            background: #ff7c2c;
            border-color: #ff7c2c;
        }

        .social-btn.max:hover {
            background: rgba(255, 124, 44, 0.8);
        }

        .social-btn.tg {
            background: #009b35;
            border-color: #009b35;
        }

        .social-btn.tg:hover {
            background: rgba(0, 155, 53, 0.8);
        }

        .social-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .social-btn.disabled {
            background: #e0e0e0;
            border-color: #e0e0e0;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .social-btn.disabled:hover {
            transform: none;
        }

        .social-btn.disabled svg {
            fill: #999;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }

            .resources-grid {
                grid-template-columns: 1fr;
            }

            .resource-card {
                padding: 20px;
            }
        }
    </style>
</head>
